services:
  web:
    build: .
    init: true
    restart: unless-stopped
    ports:
      - "127.0.0.1:${APP_PORT:-8766}:8000"
    environment:
      DEBUG: "0"
      SECRET_KEY: "${SECRET_KEY:?Configure SECRET_KEY en .env.docker}"
      ALLOWED_HOSTS: "${ALLOWED_HOSTS:-localhost,127.0.0.1}"
      PLANT_TIME_ZONE: "${PLANT_TIME_ZONE:-America/Mexico_City}"
      SERVE_STATIC: "1"
      SQLITE_PATH: /data/db.sqlite3
      PRIVATE_DIR: /data/private
      MAX_EXCEL_BYTES: "${MAX_EXCEL_BYTES:-10485760}"
      MAX_EXCEL_ROWS: "${MAX_EXCEL_ROWS:-50000}"
      MAX_EXCEL_UNCOMPRESSED: "${MAX_EXCEL_UNCOMPRESSED:-104857600}"
    volumes:
      - fcd_data:/data
    stop_grace_period: 30s

volumes:
  fcd_data:
