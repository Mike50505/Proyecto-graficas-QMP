# Optional override: docker compose --env-file .env.docker -f compose.yaml -f compose.postgres.yaml up -d --build
services:
  web:
    environment:
      DB_ENGINE: postgresql
      DB_NAME: "${POSTGRES_DB:-fcd}"
      DB_USER: "${POSTGRES_USER:-fcd}"
      DB_PASSWORD: "${POSTGRES_PASSWORD:?Configure POSTGRES_PASSWORD para PostgreSQL}"
      DB_HOST: db
      DB_PORT: "5432"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: "${POSTGRES_DB:-fcd}"
      POSTGRES_USER: "${POSTGRES_USER:-fcd}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Configure POSTGRES_PASSWORD para PostgreSQL}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

volumes:
  postgres_data:
